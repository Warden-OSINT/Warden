name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Versión fija, la misma que en local: un salto de versión mayor (como v2 → v3) no
          # debe tumbar el CI de todos los PR sin aviso.
          version: 3.0.0
      # Aplica migraciones + seed en un Postgres limpio para detectar SQL inválido.
      - run: supabase db start
