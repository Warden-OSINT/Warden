name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Versión fija: `latest` saltó a la v3, que rechaza [inbucket] en config.toml. Migrar a
          # la v3 (y a [local_smtp]) es un cambio aparte; usar la misma versión que en local.
          version: 2.107.0
      # Aplica migraciones + seed en un Postgres limpio para detectar SQL inválido.
      - run: supabase db start
