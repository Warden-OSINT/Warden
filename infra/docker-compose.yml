# Entorno local del worker y SpiderFoot. Supabase se levanta aparte con `pnpm db:start`.
#   docker compose -f infra/docker-compose.yml up --build
services:
  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    env_file: ../.env
    environment:
      # Desde el contenedor, Supabase local y SpiderFoot se alcanzan por estos nombres.
      SUPABASE_URL: http://host.docker.internal:54321
      SPIDERFOOT_URL: http://spiderfoot:5001
    depends_on:
      - spiderfoot
    restart: unless-stopped

  spiderfoot:
    # Imagen construida desde el repositorio oficial (MIT). Usar solo el caso de uso "passive".
    build: https://github.com/smicallef/spiderfoot.git#v4.0
    ports:
      - "5001:5001"
    volumes:
      - spiderfoot-data:/var/lib/spiderfoot
    restart: unless-stopped

  splunk:
    # Splunk local solo para demo de la integración SIEM (no arranca por defecto):
    #   docker compose --env-file .env -f infra/docker-compose.yml --profile splunk up -d splunk
    # Requiere en .env SPLUNK_PASSWORD, SPLUNK_HEC_TOKEN y aceptar licencia y términos
    # (SPLUNK_START_ARGS, SPLUNK_GENERAL_TERMS). Web en http://localhost:8000 (usuario admin).
    image: splunk/splunk:latest
    profiles: [splunk]
    environment:
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:?define SPLUNK_PASSWORD en .env}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:?define SPLUNK_HEC_TOKEN en .env}
      SPLUNK_START_ARGS: ${SPLUNK_START_ARGS:-}
      SPLUNK_GENERAL_TERMS: ${SPLUNK_GENERAL_TERMS:-}
      # HEC sin TLS solo en local; en producción la empresa usa https.
      SPLUNK_HEC_SSL: "false"
    ports:
      - "8000:8000"
      - "8088:8088"
    volumes:
      - splunk-var:/opt/splunk/var
    restart: unless-stopped

volumes:
  spiderfoot-data:
  splunk-var:
